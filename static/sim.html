<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟交易终端</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <div class="logo" onclick="location.href='/home'">📈 模拟盘 · 交易终端</div>
  <nav id="auth-slot"></nav>
</div>

<div class="container">

  <!-- 登录 -->
  <div id="login" class="login-box panel hidden">
    <h2 id="login-title">登录模拟盘</h2>
    <div class="field"><label>账号</label><input id="acc" placeholder="账号"></div>
    <div class="field"><label>密码</label><input id="pwd" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')App.isReg?doRegister():doLogin()"></div>
    <div class="field"><label id="nick-field" class="hidden">昵称</label><input id="nick" class="hidden" placeholder="昵称(注册用)"></div>
    <button style="width:100%;" onclick="App.isReg?doRegister():doLogin()">登录</button>
    <div class="center muted" style="margin-top:10px;">
      <a href="javascript:void(0)" id="toggle-reg" onclick="toggleReg()">没有账号？注册</a>
    </div>
  </div>

  <!-- 终端 -->
  <div id="terminal" class="hidden">
    <div class="panel">
      <div class="row" style="align-items:center; justify-content:space-between;">
        <h2 style="margin:0;">我的模拟账户</h2>
        <button class="btn-sm ghost" onclick="loadSummary()">刷新</button>
      </div>
      <div class="row" id="account-stats" style="margin-top:12px;"></div>
    </div>

    <div class="panel">
      <h2>模拟交易</h2>
      <div class="row">
        <div class="field"><label>资产类型</label>
          <select id="assetType" onchange="onAssetChange()">
            <option value="stock">个股</option>
            <option value="fund">基金</option>
          </select>
        </div>
        <div class="field" id="marketTypeField" style="display:none;"><label>基金市场</label>
          <select id="marketType" onchange="onAssetChange()">
            <option value="on">场内(ETF/LOF)</option>
            <option value="off">场外(开放式)</option>
          </select>
        </div>
        <div class="field"><label>方向</label>
          <select id="side" onchange="onAssetChange()">
            <option value="buy">买入</option>
            <option value="sell">卖出</option>
          </select>
        </div>
        <div class="field"><label>代码</label><input id="code" placeholder="6位代码" onblur="onCodeBlur()"></div>
        <div class="field"><label>名称(可选)</label><input id="name" placeholder="名称"></div>
        <div class="field" id="qtyField"><label id="qtyLabel">数量(股)</label><input id="qty" type="number" min="0" placeholder="数量"></div>
        <div class="field hidden" id="amtField"><label>申购金额(元)</label><input id="amt" type="number" min="0" placeholder="金额"></div>
        <div class="field"><label>指定价格(可选)</label><input id="price" type="number" min="0" placeholder="留空取实时价"></div>
      </div>
      <div class="row">
        <button onclick="submitTrade()">提交委托</button>
        <button class="danger" onclick="resetAccount()">重置账户</button>
      </div>
      <div class="muted" id="trade-tip" style="margin-top:8px;"></div>
      <div class="muted" id="nav-info" style="margin-top:4px;"></div>
    </div>

    <div class="panel">
      <h2>持仓 — 个股</h2>
      <table id="stock-pos"><thead><tr>
        <th>代码</th><th>名称</th><th>股数</th><th>成本价</th><th>现价</th><th>市值</th><th>浮动盈亏</th><th>已实现</th>
      </tr></thead><tbody></tbody></table>
    </div>

    <div class="panel">
      <h2>持仓 — 基金</h2>
      <table id="fund-pos"><thead><tr>
        <th>代码</th><th>名称</th><th>类型</th><th>份额</th><th>成本价</th><th>现价/净值</th><th>市值</th><th>浮动盈亏</th><th>已实现</th>
      </tr></thead><tbody></tbody></table>
    </div>

    <div class="panel">
      <h2>交易流水</h2>
      <table id="trades"><thead><tr>
        <th>时间</th><th>类型</th><th>方向</th><th>代码</th><th>名称</th><th>价格</th><th>数量/份额</th><th>金额</th><th>费用</th><th>余额</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
App.isReg = false;

function toggleReg() {
  App.isReg = !App.isReg;
  document.getElementById('login-title').textContent = App.isReg ? '注册模拟盘账号' : '登录模拟盘';
  document.getElementById('nick-field').classList.toggle('hidden', !App.isReg);
  document.getElementById('nick').classList.toggle('hidden', !App.isReg);
  document.querySelector('#login button').textContent = App.isReg ? '注册' : '登录';
  document.getElementById('toggle-reg').textContent = App.isReg ? '已有账号？去登录' : '没有账号？注册';
}

async function doLogin() {
  try {
    await App.login(document.getElementById('acc').value.trim(), document.getElementById('pwd').value);
    App.toast('登录成功');
    boot();
  } catch (e) { App.toast(e.message); }
}
async function doRegister() {
  try {
    await App.register(
      document.getElementById('acc').value.trim(),
      document.getElementById('pwd').value,
      document.getElementById('nick').value.trim()
    );
    App.toast('注册成功，自动登录中');
    await doLogin();
  } catch (e) { App.toast(e.message); }
}

function onAssetChange() {
  const asset = document.getElementById('assetType').value;
  const mt = document.getElementById('marketType').value;
  const side = document.getElementById('side').value;
  const mtField = document.getElementById('marketTypeField');
  const qtyField = document.getElementById('qtyField');
  const amtField = document.getElementById('amtField');
  const qtyLabel = document.getElementById('qtyLabel');
  const tip = document.getElementById('trade-tip');

  mtField.style.display = (asset === 'fund') ? '' : 'none';
  // 数量/金额切换
  if (asset === 'stock') {
    qtyField.classList.remove('hidden'); amtField.classList.add('hidden');
    qtyLabel.textContent = '数量(股)';
    tip.textContent = '个股按实时价成交（留空自动取实时价），手续费万三、最低5元。';
  } else if (mt === 'on') {
    qtyField.classList.remove('hidden'); amtField.classList.add('hidden');
    qtyLabel.textContent = '数量(份)';
    tip.textContent = '场内基金按实时市价成交。';
  } else { // 场外
    if (side === 'buy') {
      qtyField.classList.add('hidden'); amtField.classList.remove('hidden');
      tip.textContent = '场外基金按最新净值申购：输入申购金额，自动换算份额。';
    } else {
      qtyField.classList.remove('hidden'); amtField.classList.add('hidden');
      qtyLabel.textContent = '赎回份额';
      tip.textContent = '场外基金赎回：输入赎回份额，按最新净值结算。';
    }
    refreshNav();
  }
}

async function onCodeBlur() {
  const asset = document.getElementById('assetType').value;
  const mt = document.getElementById('marketType').value;
  if (asset === 'fund' && mt === 'off') refreshNav();
}

// 场外基金：拉取/补抓最新净值并展示（供申购赎回定价）
async function refreshNav() {
  const el = document.getElementById('nav-info');
  const asset = document.getElementById('assetType').value;
  const mt = document.getElementById('marketType').value;
  if (!(asset === 'fund' && mt === 'off')) { el.innerHTML = ''; return; }
  const code = document.getElementById('code').value.trim();
  if (!code) { el.innerHTML = ''; return; }
  try {
    const d = await App.api('/market/fund/' + code);
    const dt = new Date(d.nav_date);
    const dateStr = isNaN(dt) ? '' : dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
    el.innerHTML = `当前净值：<b>${App.fmtNum(d.net_worth)}</b>　日涨跌：<span class="${App.chgClass(d.day_rate)}">${App.fmtPct(d.day_rate)}</span>　净值日期：${dateStr}`;
  } catch (e) {
    el.textContent = '暂无可用的基金净值（请确认代码，或在后台执行「同步净值」）';
  }
}

async function loadSummary() {
  try {
    const data = await App.api('/sim/summary');
    renderAccount(data.account, data.realtime_available);
    renderPositions(data.stock_positions, data.fund_positions);
    await renderTrades();
  } catch (e) { App.toast(e.message); }
}

function renderAccount(a, rt) {
  const pnlCls = App.chgClass(a.total_pnl);
  document.getElementById('account-stats').innerHTML = `
    <div class="stat"><div class="label">总资产</div><div class="value">¥${App.fmtNum(a.total_asset)}</div></div>
    <div class="stat"><div class="label">可用资金</div><div class="value">¥${App.fmtNum(a.cash_balance)}</div></div>
    <div class="stat"><div class="label">初始资金</div><div class="value">¥${App.fmtNum(a.initial_capital)}</div></div>
    <div class="stat"><div class="label">总盈亏</div><div class="value ${pnlCls}">${App.fmtNum(a.total_pnl)} (${App.fmtPct(a.total_pnl_pct)})</div></div>
    <div class="stat"><div class="label">持仓数</div><div class="value">${a.position_count}</div></div>
    <div class="stat"><div class="label">行情</div><div class="value" style="font-size:14px;"><span class="pill ${rt?'':'bad'}">${rt?'实时':'离线'}</span></div></div>
  `;
}

function pnlCell(pnl, pct) {
  const cls = App.chgClass(pnl);
  return `<span class="${cls}">${App.fmtNum(pnl)} (${App.fmtPct(pct)})</span>`;
}

function renderPositions(stocks, funds) {
  const sbody = document.querySelector('#stock-pos tbody');
  sbody.innerHTML = stocks.length ? stocks.map(p => `<tr>
    <td>${p.stock_code}</td><td>${p.stock_name||''}</td><td>${App.fmtNum(p.shares,0)}</td>
    <td>${App.fmtNum(p.avg_cost)}</td><td>${App.fmtNum(p.current_price)}</td>
    <td>${App.fmtNum(p.market_value)}</td>
    <td>${pnlCell(p.floating_pnl, p.floating_pnl_pct)}</td>
    <td>${App.fmtNum(p.realized_pnl)}</td></tr>`).join('')
    : '<tr><td colspan="8" class="center muted">暂无持仓</td></tr>';

  const fbody = document.querySelector('#fund-pos tbody');
  fbody.innerHTML = funds.length ? funds.map(p => `<tr>
    <td>${p.fund_code}</td><td>${p.fund_name||''}</td>
    <td><span class="tag ${p.market_type}">${p.market_type==='on'?'场内':'场外'}</span></td>
    <td>${App.fmtNum(p.shares)}</td><td>${App.fmtNum(p.avg_cost)}</td>
    <td>${App.fmtNum(p.current_price)}</td><td>${App.fmtNum(p.market_value)}</td>
    <td>${pnlCell(p.floating_pnl, p.floating_pnl_pct)}</td>
    <td>${App.fmtNum(p.realized_pnl)}</td></tr>`).join('')
    : '<tr><td colspan="9" class="center muted">暂无持仓</td></tr>';
}

async function renderTrades() {
  try {
    const trades = await App.api('/sim/trades?limit=100');
    const body = document.querySelector('#trades tbody');
    body.innerHTML = trades.length ? trades.map(t => `<tr>
      <td>${App.fmtTime(t.created_at)}</td>
      <td>${t.asset_type==='stock'?'个股':'基金'}</td>
      <td class="${t.side==='buy'?'up':'down'}">${t.side==='buy'?'买入':'卖出'}</td>
      <td>${t.code}</td><td>${t.name||''}</td><td>${App.fmtNum(t.price)}</td>
      <td>${App.fmtNum(t.shares)}</td><td>${App.fmtNum(t.amount)}</td>
      <td>${App.fmtNum(t.fee)}</td><td>${App.fmtNum(t.cash_after)}</td></tr>`).join('')
      : '<tr><td colspan="10" class="center muted">暂无交易</td></tr>';
  } catch (e) { App.toast(e.message); }
}

async function submitTrade() {
  const asset = document.getElementById('assetType').value;
  const code = document.getElementById('code').value.trim();
  const name = document.getElementById('name').value.trim();
  const price = document.getElementById('price').value;
  if (!code) { App.toast('请输入代码'); return; }
  const priceBody = price ? `,"price":${Number(price)}` : '';
  let path, body;
  if (asset === 'stock') {
    const qty = Number(document.getElementById('qty').value);
    if (!qty || qty <= 0) { App.toast('请输入有效数量'); return; }
    path = '/sim/stock/' + (document.getElementById('side').value);
    body = `{"stock_code":"${code}","stock_name":"${name}","shares":${qty}${priceBody}}`;
  } else {
    const mt = document.getElementById('marketType').value;
    const side = document.getElementById('side').value;
    path = '/sim/fund/' + side;
    const qty = Number(document.getElementById('qty').value);
    const amt = Number(document.getElementById('amt').value);
    if (mt === 'on') {
      if (!qty || qty <= 0) { App.toast('请输入有效份额'); return; }
      body = `{"fund_code":"${code}","fund_name":"${name}","market_type":"on","shares":${qty}${priceBody}}`;
    } else {
      if (side === 'buy') {
        if (!amt || amt <= 0) { App.toast('请输入申购金额'); return; }
        body = `{"fund_code":"${code}","fund_name":"${name}","market_type":"off","amount":${amt}${priceBody}}`;
      } else {
        if (!qty || qty <= 0) { App.toast('请输入赎回份额'); return; }
        body = `{"fund_code":"${code}","fund_name":"${name}","market_type":"off","shares":${qty}${priceBody}}`;
      }
    }
  }
  try {
    await App.api(path, { method: 'POST', body });
    App.toast('委托成功');
    loadSummary();
  } catch (e) { App.toast(e.message); }
}

async function resetAccount() {
  if (!confirm('确定重置模拟账户？将清空全部持仓与流水。')) return;
  try {
    await App.api('/sim/reset', { method: 'POST', body: '{}' });
    App.toast('账户已重置');
    loadSummary();
  } catch (e) { App.toast(e.message); }
}

function boot() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('terminal').classList.remove('hidden');
  onAssetChange();
  loadSummary();
}

App.renderAuth();
if (App.isLogin()) boot();
else document.getElementById('login').classList.remove('hidden');
</script>
</body>
</html>
