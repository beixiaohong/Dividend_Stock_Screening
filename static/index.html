<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行情中心 · 模拟盘</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <div class="page-head">
    <div>
      <h1>行情中心</h1>
      <div class="sub">实时聚合 · 涨跌家数 · 点击卡片查看详情</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
      <span id="status" class="pill">连接中…</span>
      <span class="muted" id="updated"></span>
      <label class="switch" title="每15秒自动刷新">
        <input type="checkbox" id="auto" checked><span class="track"></span>
      </label>
      <span class="muted">自动刷新</span>
      <button class="btn sm ghost" onclick="loadHome()">刷新</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title"><h2>市场概览</h2><span class="meta" id="breadth-meta"></span></div>
    <div class="breadth" id="breadth"></div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <div class="tabs" id="tabs">
        <button data-tab="all" class="active" onclick="setTab('all')">推荐</button>
        <button data-tab="index" onclick="setTab('index')">指数</button>
        <button data-tab="stock" onclick="setTab('stock')">股票</button>
        <button data-tab="etf" onclick="setTab('etf')">ETF</button>
        <button data-tab="fund" onclick="setTab('fund')">基金</button>
      </div>
      <div class="search-wrap">
        <input id="search" placeholder="搜索代码 / 名称…" oninput="onSearch()" onblur="setTimeout(hideSuggest,150)">
        <div class="suggest hidden" id="suggest"></div>
      </div>
    </div>
    <div id="boards"></div>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/charts.js"></script>
<script>
App.mount('home');

const CAT_LABEL = { index: '指数', stock: '股票', etf: 'ETF', fund: '基金' };
let HOME = null;
let activeTab = 'all';
let timer = null;

function setTab(t) {
  activeTab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  renderBoards();
}

async function loadHome() {
  try {
    HOME = await App.api('/market/home');
    const rt = HOME.realtime_available;
    const st = document.getElementById('status');
    st.textContent = rt ? '实时行情已连接' : '行情源暂不可用';
    st.className = 'pill' + (rt ? '' : ' bad');
    document.getElementById('updated').textContent = '更新于 ' + (HOME.updated_at || '');
    renderBreadth();
    renderBoards();
  } catch (e) {
    document.getElementById('status').textContent = '加载失败';
    document.getElementById('status').className = 'pill bad';
    App.toast(e.message);
  }
}

function allItems() {
  if (!HOME) return [];
  return [].concat(HOME.indices || [], HOME.stocks || [], HOME.etfs || [], HOME.funds || []);
}

function renderBreadth() {
  const items = allItems();
  let up = 0, down = 0, flat = 0;
  items.forEach(it => {
    const p = it.change_pct;
    if (p === null || p === undefined || isNaN(p) || p === 0) flat++;
    else if (p > 0) up++; else down++;
  });
  const total = up + down + flat || 1;
  const pct = v => (v / total * 100).toFixed(1);
  document.getElementById('breadth').innerHTML = `
    <div class="b"><div class="muted">上涨</div><div class="n up">${up}</div></div>
    <div class="b"><div class="muted">下跌</div><div class="n down">${down}</div></div>
    <div class="b"><div class="muted">平盘</div><div class="n flat">${flat}</div></div>
    <div class="b" style="grid-column:span 1;">
      <div class="muted">涨跌分布</div>
      <div class="bar-track">
        <div class="up-seg" style="width:${pct(up)}%"></div>
        <div class="flat-seg" style="width:${pct(flat)}%"></div>
        <div class="down-seg" style="width:${pct(down)}%"></div>
      </div>
    </div>`;
  document.getElementById('breadth-meta').textContent = '共 ' + items.length + ' 个标的';
}

function renderBoards() {
  const root = document.getElementById('boards');
  _cardReg = [];
  if (!HOME) { root.innerHTML = ''; return; }
  if (activeTab === 'all') {
    const cats = ['index', 'stock', 'etf', 'fund'];
    root.innerHTML = cats.map(c => boardSection(c, HOME[catKey(c)] || [])).join('');
  } else {
    root.innerHTML = boardSection(activeTab, HOME[catKey(activeTab)] || []);
  }
}
function catKey(c) { return { index: 'indices', stock: 'stocks', etf: 'etfs', fund: 'funds' }[c]; }

let _cardReg = [];
function boardSection(cat, items) {
  if (!items.length) return '';
  const cards = items.map(card).join('');
  return `<div style="margin-bottom:14px;">
    <div class="panel-title" style="margin:0 0 10px;"><h2>${CAT_LABEL[cat]}</h2><span class="meta">${items.length}</span></div>
    <div class="cards">${cards}</div></div>`;
}

function card(it) {
  const idx = _cardReg.length; _cardReg.push(it);
  const cls = App.chgClass(it.change_pct);
  const price = (it.price === null || it.price === undefined) ? '--' : App.fmtNum(it.price);
  const chg = (it.change_pct === null || it.change_pct === undefined)
    ? '<span class="muted">--</span>'
    : `<span class="${cls}">${App.fmtPct(it.change_pct)}</span>`;
  const amt = (it.change_amount !== null && it.change_amount !== undefined)
    ? `<div class="${cls}" style="font-size:13px;">${it.change_amount >= 0 ? '+' : ''}${App.fmtNum(it.change_amount)}</div>` : '';
  const tag = (it.category === 'fund')
    ? `<span class="tag ${it.market_type}">${it.market_type === 'on' ? '场内' : '场外'}</span>` : '';
  return `<div class="quote-card" onclick="goDetail(${idx})">
    <div class="qbar ${cls}"></div>
    <div class="qname">${App.escapeHtml(it.name)} ${tag}</div>
    <div class="qcode">${App.escapeHtml(it.code)}</div>
    <div class="qprice ${cls}">${price}</div>
    <div class="qchg ${cls}">${chg} ${amt}</div>
  </div>`;
}

// ---------------- 详情跳转 ----------------
function detailUrl(it) {
  if (it.category === 'fund')
    return '/fund?code=' + encodeURIComponent(it.code) + '&mt=' + encodeURIComponent(it.market_type || 'off');
  if (it.category === 'index')
    return '/index?symbol=' + encodeURIComponent(it.symbol);
  return '/stock?symbol=' + encodeURIComponent(it.symbol); // 股票 / ETF
}
function goDetail(idx) {
  const it = _cardReg[idx];
  if (it) location.href = detailUrl(it);
}

// ---------------- 搜索 ----------------
let searchTimer = null;
function onSearch() {
  const q = document.getElementById('search').value.trim();
  clearTimeout(searchTimer);
  if (!q) { hideSuggest(); return; }
  searchTimer = setTimeout(async () => {
    const list = await App.search(q);
    const box = document.getElementById('suggest');
    if (!list.length) { box.innerHTML = '<div class="item muted">无匹配结果</div>'; box.classList.remove('hidden'); return; }
    box.innerHTML = list.map(r =>
      `<div class="item" onmousedown="pickSearch('${r.symbol}')">
         <span><b>${App.escapeHtml(r.name)}</b></span><span class="sc">${App.escapeHtml(r.code)} · ${r.symbol}</span></div>`).join('');
    box.classList.remove('hidden');
  }, 250);
}
function pickSearch(symbol) {
  hideSuggest();
  document.getElementById('search').value = '';
  if (/^(sh000|sz399|sh880|sh930)/.test(symbol))
    location.href = '/index?symbol=' + encodeURIComponent(symbol);
  else
    location.href = '/stock?symbol=' + encodeURIComponent(symbol);
}
function hideSuggest() { document.getElementById('suggest').classList.add('hidden'); }

// ---------------- 自动刷新 ----------------
function startTimer() {
  clearInterval(timer);
  if (document.getElementById('auto').checked) {
    timer = setInterval(() => { if (document.visibilityState === 'visible') loadHome(); }, 15000);
  }
}
document.getElementById('auto').addEventListener('change', startTimer);

loadHome();
startTimer();
</script>
</body>
</html>
