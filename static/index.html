<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行情中心 · 模拟盘</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <div class="page-head">
    <div>
      <h1>行情中心</h1>
      <div class="sub">实时聚合 · 涨跌家数 · 点击卡片查看详情</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
      <span id="status" class="pill">连接中…</span>
      <span class="muted" id="updated"></span>
      <label class="switch" title="每15秒自动刷新">
        <input type="checkbox" id="auto" checked><span class="track"></span>
      </label>
      <span class="muted">自动刷新</span>
      <button class="btn sm ghost" onclick="loadHome()">刷新</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title"><h2>市场概览</h2><span class="meta" id="breadth-meta"></span></div>
    <div class="breadth" id="breadth"></div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <div class="tabs" id="tabs">
        <button data-tab="all" class="active" onclick="setTab('all')">推荐</button>
        <button data-tab="index" onclick="setTab('index')">指数</button>
        <button data-tab="stock" onclick="setTab('stock')">股票</button>
        <button data-tab="etf" onclick="setTab('etf')">ETF</button>
        <button data-tab="fund" onclick="setTab('fund')">基金</button>
      </div>
      <div class="search-wrap">
        <input id="search" placeholder="搜索代码 / 名称…" oninput="onSearch()" onblur="setTimeout(hideSuggest,150)">
        <div class="suggest hidden" id="suggest"></div>
      </div>
    </div>
    <div id="boards"></div>
  </div>
</div>

<div id="modal-root"></div>

<script src="/static/common.js"></script>
<script src="/static/charts.js"></script>
<script>
App.mount('home');

const CAT_LABEL = { index: '指数', stock: '股票', etf: 'ETF', fund: '基金' };
let HOME = null;
let activeTab = 'all';
let timer = null;

function setTab(t) {
  activeTab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  renderBoards();
}

async function loadHome() {
  try {
    HOME = await App.api('/market/home');
    const rt = HOME.realtime_available;
    const st = document.getElementById('status');
    st.textContent = rt ? '实时行情已连接' : '行情源暂不可用';
    st.className = 'pill' + (rt ? '' : ' bad');
    document.getElementById('updated').textContent = '更新于 ' + (HOME.updated_at || '');
    renderBreadth();
    renderBoards();
  } catch (e) {
    document.getElementById('status').textContent = '加载失败';
    document.getElementById('status').className = 'pill bad';
    App.toast(e.message);
  }
}

function allItems() {
  if (!HOME) return [];
  return [].concat(HOME.indices || [], HOME.stocks || [], HOME.etfs || [], HOME.funds || []);
}

function renderBreadth() {
  const items = allItems();
  let up = 0, down = 0, flat = 0;
  items.forEach(it => {
    const p = it.change_pct;
    if (p === null || p === undefined || isNaN(p) || p === 0) flat++;
    else if (p > 0) up++; else down++;
  });
  const total = up + down + flat || 1;
  const pct = v => (v / total * 100).toFixed(1);
  document.getElementById('breadth').innerHTML = `
    <div class="b"><div class="muted">上涨</div><div class="n up">${up}</div></div>
    <div class="b"><div class="muted">下跌</div><div class="n down">${down}</div></div>
    <div class="b"><div class="muted">平盘</div><div class="n flat">${flat}</div></div>
    <div class="b" style="grid-column:span 1;">
      <div class="muted">涨跌分布</div>
      <div class="bar-track">
        <div class="up-seg" style="width:${pct(up)}%"></div>
        <div class="flat-seg" style="width:${pct(flat)}%"></div>
        <div class="down-seg" style="width:${pct(down)}%"></div>
      </div>
    </div>`;
  document.getElementById('breadth-meta').textContent = '共 ' + items.length + ' 个标的';
}

function renderBoards() {
  const root = document.getElementById('boards');
  _cardReg = [];
  if (!HOME) { root.innerHTML = ''; return; }
  if (activeTab === 'all') {
    const cats = ['index', 'stock', 'etf', 'fund'];
    root.innerHTML = cats.map(c => boardSection(c, HOME[catKey(c)] || [])).join('');
  } else {
    root.innerHTML = boardSection(activeTab, HOME[catKey(activeTab)] || []);
  }
}
function catKey(c) { return { index: 'indices', stock: 'stocks', etf: 'etfs', fund: 'funds' }[c]; }

let _cardReg = [];
function boardSection(cat, items) {
  if (!items.length) return '';
  const cards = items.map(card).join('');
  return `<div style="margin-bottom:14px;">
    <div class="panel-title" style="margin:0 0 10px;"><h2>${CAT_LABEL[cat]}</h2><span class="meta">${items.length}</span></div>
    <div class="cards">${cards}</div></div>`;
}

function card(it) {
  const idx = _cardReg.length; _cardReg.push(it);
  const cls = App.chgClass(it.change_pct);
  const price = (it.price === null || it.price === undefined) ? '--' : App.fmtNum(it.price);
  const chg = (it.change_pct === null || it.change_pct === undefined)
    ? '<span class="muted">--</span>'
    : `<span class="${cls}">${App.fmtPct(it.change_pct)}</span>`;
  const amt = (it.change_amount !== null && it.change_amount !== undefined)
    ? `<div class="${cls}" style="font-size:13px;">${it.change_amount >= 0 ? '+' : ''}${App.fmtNum(it.change_amount)}</div>` : '';
  const tag = (it.category === 'fund')
    ? `<span class="tag ${it.market_type}">${it.market_type === 'on' ? '场内' : '场外'}</span>` : '';
  return `<div class="quote-card" onclick="openDetail(${idx})">
    <div class="qbar ${cls}"></div>
    <div class="qname">${App.escapeHtml(it.name)} ${tag}</div>
    <div class="qcode">${App.escapeHtml(it.code)}</div>
    <div class="qprice ${cls}">${price}</div>
    <div class="qchg ${cls}">${chg} ${amt}</div>
  </div>`;
}

// ---------------- 详情模态 ----------------
function showModal(html) {
  document.getElementById('modal-root').innerHTML =
    `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
       <div class="modal"><span class="close" onclick="closeModal()">×</span>${html}</div>
     </div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function openDetail(arg) {
  const it = (typeof arg === 'number') ? _cardReg[arg] : arg;
  if (it.category === 'fund' && it.market_type === 'off') return openFundDetail(it);
  const sym = it.symbol;
  if (!sym) { App.toast('该标的暂无实时行情'); return; }
  showModal('<div id="detail-body"><div class="empty">加载中…</div></div>');
  (async () => {
    try {
      const q = await App.api('/market/quote?symbol=' + sym);
      let kl = [];
      try { kl = await App.api('/market/kline?symbol=' + sym + '&count=60'); } catch (e) {}
      renderQuoteDetail(it, q, kl);
    } catch (e) {
      document.getElementById('detail-body').innerHTML = '<div class="empty">' + App.escapeHtml(e.message) + '</div>';
    }
  })();
}

function renderQuoteDetail(it, q, kl) {
  const cls = App.chgClass(q.change_pct);
  const stats = [
    ['今开', App.fmtNum(q.open)], ['最高', App.fmtNum(q.high)],
    ['最低', App.fmtNum(q.low)], ['昨收', App.fmtNum(q.prev_close)],
    ['成交额', q.amount ? App.fmtNum(q.amount / 1e8, 2) + '亿' : '--'],
    ['换手率', q.turnover_rate ? App.fmtPct(q.turnover_rate) : '--'],
    ['市盈率', q.pe != null ? App.fmtNum(q.pe) : '--'],
    ['市净率', q.pb != null ? App.fmtNum(q.pb) : '--'],
  ].map(([k, v]) => `<div class="stat"><div class="label">${k}</div><div class="value" style="font-size:15px;">${v}</div></div>`).join('');

  const series = (kl || []).map(k => ({ label: k.date.slice(5), value: k.close }));
  document.getElementById('detail-body').innerHTML = `
    <h3>${App.escapeHtml(q.name)} <span class="muted" style="font-size:13px;font-weight:400;">${App.escapeHtml(q.code)}</span></h3>
    <div style="display:flex;align-items:baseline;gap:12px;margin:6px 0 14px;">
      <div class="qprice ${cls}" style="font-size:28px;margin:0;">${App.fmtNum(q.price)}</div>
      <div class="${cls}" style="font-size:15px;">${App.fmtPct(q.change_pct)}　${q.change_amount >= 0 ? '+' : ''}${App.fmtNum(q.change_amount)}</div>
    </div>
    <div class="stat-grid" style="margin-bottom:14px;">${stats}</div>
    <div class="panel-title"><h2>近60日走势</h2></div>
    <div class="chart" id="detail-chart"></div>
    <div style="margin-top:14px;"><a class="btn" href="/sim?code=${encodeURIComponent(q.code)}">在模拟盘交易 →</a></div>`;
  if (series.length) Charts.line(document.getElementById('detail-chart'), series, { height: 220 });
}

async function openFundDetail(it) {
  showModal('<div id="detail-body"><div class="empty">加载中…</div></div>');
  try {
    const nav = await App.api('/market/fund/' + it.code);
    const cls = App.chgClass(nav.day_rate);
    document.getElementById('detail-body').innerHTML = `
      <h3>${App.escapeHtml(nav.name)} <span class="muted" style="font-size:13px;font-weight:400;">${App.escapeHtml(nav.code)}</span>
        <span class="tag ${it.market_type}">${it.market_type === 'on' ? '场内' : '场外'}</span></h3>
      <div style="display:flex;align-items:baseline;gap:12px;margin:6px 0 14px;">
        <div class="qprice ${cls}" style="font-size:28px;margin:0;">${App.fmtNum(nav.net_worth)}</div>
        <div class="${cls}" style="font-size:15px;">${App.fmtPct(nav.day_rate)}</div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="label">单位净值</div><div class="value" style="font-size:16px;">${App.fmtNum(nav.net_worth)}</div></div>
        <div class="stat"><div class="label">日涨跌</div><div class="value ${cls}" style="font-size:16px;">${App.fmtPct(nav.day_rate)}</div></div>
        <div class="stat"><div class="label">净值日期</div><div class="value" style="font-size:15px;">${App.escapeHtml(String(nav.nav_date || '').slice(0, 10))}</div></div>
      </div>
      <div style="margin-top:14px;"><a class="btn" href="/sim?code=${encodeURIComponent(nav.code)}&mt=${it.market_type}">在模拟盘交易 →</a></div>`;
  } catch (e) {
    document.getElementById('detail-body').innerHTML = '<div class="empty">' + App.escapeHtml(e.message) + '</div>';
  }
}

// ---------------- 搜索 ----------------
let searchTimer = null;
function onSearch() {
  const q = document.getElementById('search').value.trim();
  clearTimeout(searchTimer);
  if (!q) { hideSuggest(); return; }
  searchTimer = setTimeout(async () => {
    const list = await App.search(q);
    const box = document.getElementById('suggest');
    if (!list.length) { box.innerHTML = '<div class="item muted">无匹配结果</div>'; box.classList.remove('hidden'); return; }
    box.innerHTML = list.map(r =>
      `<div class="item" onmousedown="pickSearch('${r.symbol}')">
         <span><b>${App.escapeHtml(r.name)}</b></span><span class="sc">${App.escapeHtml(r.code)} · ${r.symbol}</span></div>`).join('');
    box.classList.remove('hidden');
  }, 250);
}
function pickSearch(symbol) {
  hideSuggest();
  document.getElementById('search').value = '';
  showModal('<div id="detail-body"><div class="empty">加载中…</div></div>');
  (async () => {
    try {
      const q = await App.api('/market/quote?symbol=' + symbol);
      let kl = [];
      try { kl = await App.api('/market/kline?symbol=' + symbol + '&count=60'); } catch (e) {}
      renderQuoteDetail({ code: q.code }, q, kl);
    } catch (e) {
      document.getElementById('detail-body').innerHTML = '<div class="empty">' + App.escapeHtml(e.message) + '</div>';
    }
  })();
}
function hideSuggest() { document.getElementById('suggest').classList.add('hidden'); }

// ---------------- 自动刷新 ----------------
function startTimer() {
  clearInterval(timer);
  if (document.getElementById('auto').checked) {
    timer = setInterval(() => { if (document.visibilityState === 'visible') loadHome(); }, 15000);
  }
}
document.getElementById('auto').addEventListener('change', startTimer);

loadHome();
startTimer();
</script>
</body>
</html>
